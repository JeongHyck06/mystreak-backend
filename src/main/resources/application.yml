spring:
  application:
    name: backend
  profiles:
    active: ${ACTIVE_PROFILE:local} # 미설정 시 local (운영은 ACTIVE_PROFILE=prod)

  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${GOOGLE_MAIL_HOST:smtp.gmail.com}
    port: ${GOOGLE_MAIL_PORT:587}
    username: ${GOOGLE_MAIL_USERNAME:}
    password: ${GOOGLE_MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  media:
    s3:
      bucket: ${S3_MEDIA_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      upload-url-expires-minutes: ${S3_UPLOAD_URL_EXPIRES_MINUTES:10}
