# 운영 프로필 (EC2 컨테이너) — ACTIVE_PROFILE=prod 일 때 적용된다.
# 모든 민감 값은 환경변수(GitHub Secrets -> docker run -e)로 주입하며, 기본값을 두지 않아
# 값이 비면 기동 시점에 바로 실패하도록 한다(운영에서 localhost 등으로 잘못 붙는 것 방지).
spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # RDS 스키마는 사전에 적용해 둔다. 컨테이너가 스키마를 직접 생성하게 하려면 always 로.
      mode: ${SPRING_SQL_INIT_MODE:never}

app:
  cors:
    # 콤마로 여러 오리진 지정 가능 (예: https://mystreak.duckdns.org,https://app.example.com)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mystreak.duckdns.org}
