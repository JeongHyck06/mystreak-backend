name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  # 1) 테스트 (H2 기반, RDS 불필요)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  # 2) 이미지 빌드 & GHCR 푸시
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.prep.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name (lowercase)
        id: prep
        run: echo "image=${REGISTRY}/$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) EC2 SSH 배포
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 위 env 값들을 원격 셸로 전달 (스크립트/히스토리에 평문 노출 방지)
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,REGISTRY,MYSQL_URL,MYSQL_USERNAME,MYSQL_PASSWORD,CORS_ALLOWED_ORIGINS
          script: |
            set -e

            # GHCR 로그인 (워크플로우 토큰 사용)
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin

            # 최신 이미지 받기
            docker pull "$IMAGE"

            # 기존 컨테이너 교체
            docker stop mystreak-backend || true
            docker rm mystreak-backend || true

            docker run -d \
              --name mystreak-backend \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e MYSQL_URL="$MYSQL_URL" \
              -e MYSQL_USERNAME="$MYSQL_USERNAME" \
              -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e APP_CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
              "$IMAGE"

            # 미사용 이미지 정리
            docker image prune -f
